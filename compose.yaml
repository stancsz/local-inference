name: local-inference
services:
  inference:
    image: ghcr.io/ggml-org/llama.cpp@sha256:b0baccbe2e00b5d74e63f85f9f023c93d61d0f329475269e1e7002e87eb875ea
    gpus: all
    ports:
      - '127.0.0.1:8091:8080'
    volumes:
      - ./models:/models:ro
    command:
      - --model
      - /models/Qwen3.8-27B-UD-IQ3_XXS.gguf
      - --alias
      - qwen3.8-27b
      - --host
      - 0.0.0.0
      - --port
      - '8080'
      - --ctx-size
      - '${CONTEXT_SIZE:-28672}'
      - --parallel
      - '1'
      - --n-gpu-layers
      - '${GPU_LAYERS:-48}'
      - --fit
      - 'off'
      - --flash-attn
      - 'on'
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --batch-size
      - '256'
      - --ubatch-size
      - '128'
      - --jinja
      - --reasoning-budget
      - '0'
      - --chat-template-kwargs
      - '{"reasoning_effort":"none"}'
      - --temp
      - '0.7'
      - --top-p
      - '0.8'
      - --top-k
      - '20'
      - --min-p
      - '0'
      - --spec-type
      - '${SPEC_TYPE:-draft-mtp}'
      - --model-draft
      - /models/mtp-Qwen3.8-27B-Q4_0.gguf
      - --gpu-layers-draft
      - '${DRAFT_GPU_LAYERS:-0}'
      - --spec-draft-n-max
      - '${DRAFT_TOKENS:-2}'
    restart: 'no'
  sift:
    build:
      context: ..
      dockerfile: local-inference/docker/sift.Dockerfile
    environment:
      INFERENCE_URL: http://inference:8080
      CONTEXT_SIZE: '${CONTEXT_SIZE:-28672}'
      SIFT_TARGET: '${SIFT_TARGET:-24576}'
    ports:
      - '127.0.0.1:8090:8090'
    depends_on:
      - inference
    restart: 'no'
